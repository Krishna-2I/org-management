services:
  - type: web
    name: org-manager
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: org-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FERNET_KEYS
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://org-manager.onrender.com"
      - key: CACHE_TTL_SECONDS
        value: "60"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"

databases:
  - name: org-manager-db
    databaseName: org_manager
    user: org_manager
    plan: free
