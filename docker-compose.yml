services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: org
      POSTGRES_PASSWORD: org
      POSTGRES_DB: orgdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
